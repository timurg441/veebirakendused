<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kalkulaatorid</title>
  <link rel="stylesheet" href="kalkStyle.css">
  <script src="../../js/kalk1Script.js"></script>
  <script src="../../js/kalk2Script.js"></script>
  <script src="../../js/kalk3Script.js"></script>
</head>
<body>
<h1>Kalkulaatorid</h1>
<section id="yld">
  <section id="kalk1">
    <h2>Meetri/tolli kalkulaator</h2>
    <br>
    <label for="arv"> Sisesta arv</label>
    <input type="number" id="arv" min="1" max="100" step="1" value="10" onchange="teisendamne()">
    <br>
    <input type="radio" name="valik" id="meeter" value="meeter" onchange="teisendamne()">
    <label for="meeter">Meeter</label>
    <br>
    <input type="radio" name="valik" id="tolli" value="tolli" onchange="teisendamne()">
    <label for="tolli">Toll</label>
    <br>
    <div id="vastus"></div>
    <img src="" alt="" id="vastusepilt">
  </section>
  <section id="kalk2">
    <h2>Joogi kalkulaator</h2>
    <label for="kogus"> Mitu tk soovid:</label>
    <input type="number" id="kogus" min="1" max="100" step="1" value ="1" onchange="jookideValik()">
    <label for="joogiValik">Vali lemmikjooki:</label>
    <select name="joogiValik" id="joogiValik" onchange="jookideValik()">
      <option value="">vali</option>
      <option value="kohv">Kohv</option>
      <option value="vesi">Vesi</option>
      <option value="cola">Coca-Cola</option>
      <option value="fanta">Fanta</option>
    </select>
    <div id="vastus2"></div>
  </section>
  <section id="kalk3">
    <h2>Kohvikulu kalkulaator</h2>
    <label for="tassid">Mitu tassi nädalas:</label>
    <input type="number" id="tassid" min="1" max="100" step="1" value="5" onchange="kohviKulu()">
    <br>
    <input type="radio" name="valik3" id="kohv3" value="kohv" onchange="kohviKulu()">
    <label for="kohv3">Kohv (1.50 €)</label>
    <br>
    <input type="radio" name="valik3" id="latte3" value="latte" onchange="kohviKulu()">
    <label for="latte3">Latte (2.50 €)</label>
    <br>
    <input type="radio" name="valik3" id="cappuccino3" value="cappuccino" onchange="kohviKulu()">
    <label for="cappuccino3">Cappuccino (2.80 €)</label>
    <br>
    <div id="vastus3"></div>
    <img src="" alt="" id="vastusepilt3">
  </section>
</section>

</body>
</html>
