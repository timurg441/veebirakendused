<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <title>Iseseisev töö - Tabel</title>
  <link rel="stylesheet" href="tabelStyle.css">
</head>
<body>

<h1>Hindeline töö: Iseseisev tabel</h1>

<table id="iseseisevTabel">
  <!-- rida 1 -->
  <tr>
    <td rowspan="2" class="lahter-A">A</td>
    <td rowspan="3" class="lahter-B">B</td>
    <td colspan="2" class="lahter-E1">E</td>
    <td rowspan="3" class="lahter-5">5</td>
  </tr>
  <!-- rida 2 -->
  <tr>
    <td class="lahter-1">1</td>
    <td class="lahter-2">2</td>
  </tr>
  <!-- rida 3 -->
  <tr>
    <td class="lahter-C">C</td>
    <td class="lahter-3">3</td>
    <td class="lahter-4">4</td>
  </tr>
  <!-- rida 4 -->
  <tr>
    <td colspan="3" class="lahter-D">D</td>
    <td colspan="2" class="lahter-E2">E</td>
  </tr>
  <!-- rida 5 -->
  <tr>
    <td colspan="3" class="lahter-F">F</td>
    <td class="lahter-G">G</td>
    <td class="lahter-plus">+</td>
  </tr>
</table>

</body>
</html>
