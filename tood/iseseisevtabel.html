<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <title>Timuri iseseisev tabel</title>
  <link rel="stylesheet" href="tabelStyle.css">
</head>
<body>

<h1>Iseseisev tabel</h1>

<table id="iseseisevTabel">
  <tr height="80">
    <td colspan="2">A</td>
    <td colspan="3">B</td>
  </tr>

  <tr height="80">
    <td rowspan="3" width="80">C</td>
    <td rowspan="3" width="100">D</td>
    <td colspan="3">E</td>
  </tr>

  <tr height="50">
    <td rowspan="2" width="100">F</td>
    <td rowspan="2" width="100">1</td>
    <td width="60">2</td>
  </tr>

  <tr height="50">
    <td>3</td>
  </tr>
</table>

</body>
</html>
